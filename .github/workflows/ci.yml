name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static check
        run: npm run check
      - name: Validate Oracle Compose example (offline)
        run: |
          cd deploy/oracle
          cp .env.example .env
          cp app.env.example app.env
          docker compose config --quiet
      - name: Validate InstaBox setup and Compose (offline)
        run: |
          bash -n deploy/instabox/setup.sh deploy/instabox/run.sh
          cd deploy/instabox
          cp app.env.example app.env
          docker compose config --quiet
          rm app.env
      - name: Documentation links
        run: npm run docs:check
      - name: Validate migration schema (disposable SQLite)
        run: npm run staging:check-migrations
      - name: Test suite
        run: npm test
      - name: Docker image build
        run: docker build -t telegram-sales-bot-ci .
