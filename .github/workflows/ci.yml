name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static check
        run: npm run check
      - name: Documentation links
        run: npm run docs:check
      - name: Test suite
        run: npm test
      - name: Docker image build
        run: docker build -t telegram-sales-bot-ci .
